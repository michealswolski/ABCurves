name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-runtime:
    name: Native renderer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S runtime/c -B runtime/c/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build runtime/c/build --config Release

      - name: Test (ctest)
        run: ctest --test-dir runtime/c/build --output-on-failure -C Release

  python-tests:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Windows ships a prebuilt abcurves/_native/abcurves_renderer.dll; every
      # other platform needs the native Renderer built locally before
      # Pipeline.from_pretrained() (used by nearly every test) can load it.
      - name: Build native renderer
        if: runner.os != 'Windows'
        run: |
          cmake -S runtime/c -B runtime/c/build -DCMAKE_BUILD_TYPE=Release
          cmake --build runtime/c/build --config Release

      - name: Install abcurves (all extras + dev)
        run: python -m pip install -e ".[all,dev]"

      - name: Run tests
        run: python -m pytest -q
